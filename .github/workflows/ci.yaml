name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build fluentd image
        uses: docker/build-push-action@v7
        with:
          context: v1.16-4.10
          file: ./v1.16-4.10/Dockerfile
          target: full
          platforms: linux/amd64
          load: true
          tags: rancher/fluentd:test-full
          cache-from: type=gha,scope=linux-amd64-full
          cache-to: type=gha,mode=max,scope=linux-amd64-full

      - name: Smoke test image
        run: |
          docker run --rm rancher/fluentd:test-full --version
          docker run --rm rancher/fluentd:test-full --dry-run
